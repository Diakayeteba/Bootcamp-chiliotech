<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/app.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>calculatrice</title>
</head>

<body>
    <div class="bg-success ">
        <div class="mb-3 ">
            <label for="formGroupExampleInput" class="form-label">Premier nombre</label>
            <input type="text" class="form-control" id="nb1" placeholder="Saisi ton premier nombre">
        </div>
        <div class="mb-3">
            <label for="formGroupExampleInput2" class="form-label">Second nombre</label>
            <input type="text" class="form-control" id="nb2" placeholder="Saisi ton second nombre">
        
        </div>
        <div class="mb-3 ">
            <label class="form-label">Opération</label>
            <select class="form-select" id="operateur">
                <option value="addition">Addition (+)</option>
                <option value="soustraction">Soustraction (-)</option>
                <option value="multiplication">Multiplication (*)</option>
                <option value="division">Division (/)</option>
            </select>
        </div>
        <div><button class="btn btn-primary input-group input-group-lg" id="btnSave" type="submit">Save</button></div>
    </div>
    <script src="scripts/calculatrice.js"></script>
</body>

</html>
