<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="styles/app.css">
    <title>Operations</title>
</head>

<body>

    <div class="container bg-warning">
        <form ensubmit="calculer(event)">
        <div class="mb-3 m-3 p-4">
            <label for="firstNumber" class="form-label">Premier Nombre</label>
            <input type="number" class="form-control" id="firstNumber" placeholder="exp: 10">
        </div>
        <div class="mb-3 m-3 p-4">
            <label for="secondNombre" class="form-label">Second Nombre</label>
            <input type="number" class="form-control" id="secondNombre" placeholder="exp: 10">
        </div>


        <div class="mb-3 m-3 p-4">
        <label for="">Operations</label>
        <select class="form-select dropdown mb-1" aria-label="Default select example">
            <label for="">Operations</label>
            <option selected>--Selectionne</option>
            <option value="1">Additions</option>
            <option value="2">Soustraction</option>
            <option value="3">Produit</option>
            <option value="3">Modulo</option>

        </select>
        </div>

        <div  class="d-grid gap-2 ">

            <button type="submit" class="btn btn-operations" id="calculer" onClick="calculer()">Calculer</button>

        </div>
        <p id="result()">Resultats</p>
        </form>
    </div>
    <script src="scripts/operations.js" type="text/javascript"></script>
</body>

</html>
